<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Think You Know Ball? — Daily College × NFL Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#0e0e0e;
    --panel-hover:#191919;
    --stripe:#050505;
    --chalk:#e9e4d6;
    --gold:#d4a017;
    --gold-bright:#e8b923;
    --navy:#14213d;
    --brick:#9b2226;
    --line: rgba(233,228,214,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--bg) 0px, var(--bg) 78px, var(--stripe) 78px, var(--stripe) 82px),
      var(--bg);
    color:var(--chalk);
    font-family:'Barlow',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .wrap{width:100%;max-width:640px;}
  header{text-align:center;margin-bottom:22px;}
  .kicker{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.35em;
    font-size:11px;
    color:var(--gold-bright);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:400;
    font-size:clamp(28px,8vw,46px);
    letter-spacing:0.02em;
    margin:0;
    color:var(--chalk);
    text-shadow: 3px 3px 0 var(--navy);
    line-height:0.95;
  }
  .sub{
    font-size:13px;
    color:rgba(233,228,214,0.65);
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
  }
  .scoreboard{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:18px 0 24px;
    font-family:'IBM Plex Mono',monospace;
  }
  .sb-chip{
    background:var(--navy);
    border:1px solid var(--gold);
    border-radius:3px;
    padding:8px 14px;
    text-align:center;
    min-width:66px;
  }
  .sb-chip .num{font-size:20px;color:var(--gold-bright);font-weight:700;}
  .sb-chip .lbl{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(233,228,214,0.6);margin-top:2px;}

  .grid-frame{
    background:var(--navy);
    border:2px solid var(--gold);
    border-radius:6px;
    padding:10px;
    box-shadow:0 12px 28px rgba(0,0,0,0.35);
  }
  table.grid{border-collapse:separate;border-spacing:6px;width:100%;table-layout:fixed;}
  .corner{background:transparent;}
  .colhead, .rowhead{
    font-family:'Oswald',sans-serif;
    letter-spacing:0.02em;
    background:linear-gradient(180deg, #1c3660, var(--navy));
    color:var(--gold-bright);
    border:1px solid rgba(212,160,23,0.5);
    border-radius:4px;
    text-align:center;
    padding:8px 3px;
    line-height:1.15;
    min-width:0;
    overflow:hidden;
  }
  .badge{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    width:100%;
  }
  .badge-mark{
    width:clamp(34px,9vw,44px);
    height:clamp(34px,9vw,44px);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;
    font-size:clamp(9px,2.6vw,13px);
    letter-spacing:0.01em;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), 0 2px 6px rgba(0,0,0,0.45);
    flex-shrink:0;
  }
  .badge-label{
    font-size:9px;
    letter-spacing:0.02em;
    color:rgba(233,228,214,0.75);
    text-transform:uppercase;
    max-width:100%;
    line-height:1.15;
    overflow-wrap:break-word;
    hyphens:auto;
  }
  td.cell{
    background:var(--panel);
    border:1px solid rgba(233,228,214,0.16);
    border-radius:4px;
    height:88px;
    text-align:center;
    vertical-align:middle;
    cursor:pointer;
    position:relative;
    transition:background 0.15s;
  }
  td.cell:hover{background:var(--panel-hover);}
  td.cell.correct{background:#0f2a19;border-color:#3fae5c;cursor:default;}
  td.cell.wrong{background:#2a1012;border-color:var(--brick);cursor:default;}
  .cell-inner{
    padding:6px;
    font-size:12px;
    line-height:1.25;
  }
  .cell-plus{font-family:'Oswald',sans-serif;font-size:26px;color:rgba(233,228,214,0.35);}
  .cell-name{font-family:'Barlow',sans-serif;font-weight:600;font-size:12.5px;color:var(--chalk);}
  .cell-rarity{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold-bright);margin-top:4px;}
  .cell-miss{font-family:'Oswald',sans-serif;font-size:32px;color:var(--brick);line-height:1;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(6,14,10,0.72);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:var(--navy);border:2px solid var(--gold);border-radius:8px;
    padding:20px;width:100%;max-width:380px;
  }
  .modal h3{
    font-family:'Oswald',sans-serif;font-weight:400;font-size:18px;
    color:var(--gold-bright);margin:0 0 4px;letter-spacing:0.02em;
  }
  .modal .req{font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(233,228,214,0.7);margin-bottom:14px;}
  .modal input{
    width:100%;padding:11px 12px;border-radius:4px;border:1px solid rgba(233,228,214,0.3);
    background:var(--panel);color:var(--chalk);font-size:15px;font-family:'Barlow',sans-serif;
    outline:none;
  }
  .modal input:focus{border-color:var(--gold);}
  .suggest{max-height:220px;overflow-y:auto;margin-top:8px;border-radius:4px;overflow-x:hidden;}
  .suggest div{
    padding:9px 10px;font-size:13.5px;cursor:pointer;border-bottom:1px solid rgba(233,228,214,0.08);
    display:flex;flex-direction:column;gap:2px;
  }
  .suggest div:hover{background:var(--panel-hover);}
  .suggest-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .suggest-years{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(233,228,214,0.5);
  }
  .hint{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(233,228,214,0.55);margin-top:8px;line-height:1.4;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:14px;gap:10px;}
  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
    padding:9px 14px;border-radius:4px;border:1px solid var(--gold);background:transparent;color:var(--gold-bright);
    cursor:pointer;
  }
  .btn:hover{background:rgba(212,160,23,0.12);}
  .btn.primary{background:var(--gold);color:var(--navy);font-weight:700;}
  .btn.primary:hover{background:var(--gold-bright);}

  .summary{
    margin-top:22px;background:var(--navy);border:2px solid var(--gold);border-radius:6px;padding:20px;text-align:center;
  }
  .summary h2{font-family:'Oswald',sans-serif;font-weight:400;color:var(--gold-bright);font-size:26px;margin:0 0 6px;}
  .summary p{font-family:'IBM Plex Mono',monospace;font-size:13px;color:rgba(233,228,214,0.75);margin:4px 0;}
  footer{text-align:center;margin-top:26px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(233,228,214,0.4);}
  .note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(233,228,214,0.45);text-align:center;margin-top:14px;}

  .archive-row{
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
    margin:0 0 12px;
  }
  .archive-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(233,228,214,0.7);
  }
  #archiveDate{
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 8px;border-radius:4px;
    border:1px solid rgba(233,228,214,0.3);background:var(--panel);color:var(--chalk);
  }
  .archive-today-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px;border-radius:4px;
    border:1px solid var(--gold);background:rgba(212,160,23,0.12);color:var(--gold-bright);cursor:pointer;
  }
  .archive-today-btn:hover{background:rgba(212,160,23,0.22);}

  .toast{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:0.04em;
    padding:12px 22px;border-radius:5px;z-index:100;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:opacity 0.2s, transform 0.2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(4px);}
  .toast.correct{background:#2d6a4f;color:#e9e4d6;border:1px solid #3fae5c;}
  .toast.wrong{background:var(--brick);color:#e9e4d6;border:1px solid #d64545;}

  .cell-rarity-badge{
    display:inline-block;margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;
    padding:2px 6px;border-radius:3px;background:rgba(212,160,23,0.18);color:var(--gold-bright);
    border:1px solid rgba(212,160,23,0.4);
  }
  .cell-years{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(233,228,214,0.6);margin-top:3px;
  }

  /* ---- header controls ---- */
  .kicker-row{
    display:flex;align-items:center;justify-content:center;gap:8px;position:relative;margin-bottom:6px;
  }
  .kicker-row .kicker{margin-bottom:0;}
  .help-btn{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;
    border:1px solid var(--gold);background:transparent;color:var(--gold-bright);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .help-btn:hover{background:rgba(212,160,23,0.15);}

  .difficulty-row{
    display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap;
  }
  .difficulty-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(233,228,214,0.65);text-transform:uppercase;letter-spacing:0.08em;
  }
  .difficulty-toggle{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px;}
  .diff-btn{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.03em;
    padding:5px 11px;border-radius:16px;border:none;background:transparent;color:rgba(233,228,214,0.6);
    cursor:pointer;transition:background 0.15s, color 0.15s;
  }
  .diff-btn:hover{color:var(--chalk);}
  .diff-btn.active{background:var(--gold);color:var(--navy);font-weight:700;}
  .diff-btn.locked{color:rgba(233,228,214,0.35);cursor:not-allowed;}
  .diff-btn.locked:hover{color:rgba(233,228,214,0.45);}
  .difficulty-desc{
    text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    color:rgba(233,228,214,0.5);margin-bottom:14px;min-height:14px;
  }
  .autocomplete-row{
    display:flex;justify-content:center;margin:14px 0 0;
  }
  .autocomplete-btn{
    border-color:var(--brick);color:#e8a1a1;
    display:flex;align-items:center;gap:6px;
  }
  .autocomplete-btn:hover{background:rgba(155,34,38,0.18);}

  /* ---- cell reveal animation ---- */
  @keyframes cellPop{
    0%{transform:scale(0.85);opacity:0;}
    60%{transform:scale(1.04);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }
  td.cell.correct .cell-inner, td.cell.wrong .cell-inner{
    animation:cellPop 0.28s ease-out;
  }
  .cell-dupe{
    font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--brick);
    margin-top:3px;text-transform:uppercase;letter-spacing:0.04em;
  }

  /* ---- hint ---- */
  .hint-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;
    padding:7px 12px;border-radius:4px;border:1px dashed var(--gold);background:transparent;
    color:var(--gold-bright);cursor:pointer;margin-top:10px;width:100%;
  }
  .hint-btn:hover{background:rgba(212,160,23,0.1);}
  .hint-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .hint-reveal{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-bright);
    margin-top:8px;text-align:center;
  }

  /* ---- how-to-play modal ---- */
  .howto-list{margin:0 0 14px;padding-left:18px;font-family:'Barlow',sans-serif;font-size:13.5px;line-height:1.55;color:rgba(233,228,214,0.85);}
  .howto-list li{margin-bottom:8px;}
  .howto-list b{color:var(--gold-bright);}

  /* ---- confetti ---- */
  #confettiLayer{
    position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;
  }
  .confetti-piece{
    position:absolute;top:-20px;width:8px;height:14px;opacity:0.9;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:0.95;}
    100%{transform:translateY(105vh) rotate(540deg);opacity:0.4;}
  }

  @media (max-width:380px){
    .difficulty-label{display:none;}
    .diff-btn{padding:5px 8px;font-size:9.5px;}
    td.cell{height:76px;}
    .cell-name{font-size:11px;}
    .cell-years,.cell-rarity-badge,.cell-dupe{font-size:8.5px;}
    table.grid{border-spacing:4px;}
    .badge-label{font-size:8px;}
  }
  @media (min-width:640px){
    td.cell{height:98px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker-row">
      <div class="kicker">Daily Puzzle</div>
      <button class="help-btn" id="helpBtn" onclick="openHowTo()" title="How to play" aria-label="How to play">?</button>
    </div>
    <h1>THINK YOU KNOW BALL?</h1>
    <div class="sub" id="dateLabel">—</div>
  </header>

  <div class="difficulty-row">
    <span class="difficulty-label">Mode:</span>
    <div class="difficulty-toggle" id="difficultyToggle" role="group" aria-label="Difficulty">
      <button class="diff-btn" data-diff="rookie" onclick="setDifficulty('rookie')">Rookie</button>
      <button class="diff-btn" data-diff="pro" onclick="setDifficulty('pro')">Pro</button>
      <button class="diff-btn" data-diff="hof" onclick="setDifficulty('hof')">Hall of Fame</button>
    </div>
  </div>
  <div class="difficulty-desc" id="difficultyDesc"></div>

  <div class="scoreboard">
    <div class="sb-chip"><div class="num" id="scoreNum">0/9</div><div class="lbl">Score</div></div>
    <div class="sb-chip"><div class="num" id="guessesNum">9</div><div class="lbl">Guesses Left</div></div>
    <div class="sb-chip"><div class="num" id="streakNum">0</div><div class="lbl">Streak</div></div>
    <div class="sb-chip"><div class="num" id="playedNum">0</div><div class="lbl">Played</div></div>
  </div>

  <div class="archive-row">
    <label class="archive-label" for="archiveDate">📅 Play a past puzzle:</label>
    <input type="date" id="archiveDate" onchange="switchToDate(this.value)">
    <button class="btn archive-today-btn" id="backToTodayBtn" onclick="switchToToday()" style="display:none;">Back to Today</button>
  </div>

  <div class="grid-frame">
    <table class="grid" id="gridTable"></table>
  </div>

  <div class="autocomplete-row" id="autocompleteRow" style="display:none;">
    <button class="btn autocomplete-btn" id="autocompleteBtn" onclick="confirmAutocomplete()">🪄 Autocomplete Grid — surrenders your streak</button>
  </div>

  <div class="note" id="noteText">Guess a player who fits both the college and the NFL team. One guess per box — choose wisely.</div>

  <div id="summaryZone"></div>

  <footer>Puzzle regenerates daily · picks are shared anonymously to compute rarity</footer>
</div>

<div id="modalZone"></div>
<div id="howtoZone"></div>
<div class="toast" id="toast"></div>
<div id="confettiLayer"></div>

<script>
/* ---------------- DATA ---------------- */
const NFL_TEAMS = [
  "Bills","Dolphins","Patriots","Jets",
  "Ravens","Bengals","Browns","Steelers",
  "Texans","Colts","Jaguars","Titans",
  "Broncos","Chiefs","Raiders","Chargers",
  "Cowboys","Giants","Eagles","Commanders",
  "Bears","Lions","Packers","Vikings",
  "Falcons","Panthers","Saints","Buccaneers",
  "Cardinals","Rams","49ers","Seahawks"
];

// All current FBS (Division I top-tier) programs. Brand-new FCS call-ups with no NFL
// alumni yet (e.g. Delaware, Missouri State, Kennesaw State, North Dakota State,
// Sacramento State) are left out on purpose — including them would create grid boxes
// with zero possible answers.
const COLLEGES = [
  "Air Force","Akron","Alabama","Alabama State","Alcorn State","Appalachian State","Arizona","Arizona State",
  "Arkansas","Arkansas State","Army","Auburn","BYU","Ball State","Baylor","Boise State",
  "Boston College","Bowling Green","Buffalo","Cal","Cal Poly-San Luis Obispo","Cal State-Fullerton","California","Central Michigan",
  "Charlotte","Chattanooga","Cincinnati","Clemson","Coastal Carolina","Colorado","Colorado State","Connecticut",
  "Delaware","Duke","East Carolina","Eastern Kentucky","Eastern Michigan","Eastern Washington","FAU","FIU",
  "Florida","Florida A&M","Florida Atlantic","Florida State","Fresno State","Georgia","Georgia Southern","Georgia State",
  "Georgia Tech","Grambling State","Hampton","Hawaii","Houston","Idaho","Illinois","Indiana",
  "Iowa","Iowa State","Jackson State","Jacksonville State","James Madison","Kansas","Kansas State","Kent State",
  "Kentucky","LSU","Liberty","Louisiana","Louisiana Tech","Louisiana-Monroe","Louisville","Marshall",
  "Maryland","McNeese State","Memphis","Miami","Miami (OH)","Michigan","Michigan State","Middle Tennessee",
  "Minnesota","Mississippi State","Missouri","Montana","NC State","Navy","Nebraska","Nevada",
  "New Mexico","New Mexico State","Nicholls State","North Alabama","North Carolina","North Carolina State","North Dakota State","North Texas",
  "Northern Arizona","Northern Illinois","Northern Iowa","Northwestern","Northwestern State","Notre Dame","Ohio","Ohio State",
  "Oklahoma","Oklahoma State","Old Dominion","Ole Miss","Oregon","Oregon State","Penn State","Pitt",
  "Purdue","Rice","Richmond","Rutgers","SMU","Sam Houston","San Diego State","San Jose State",
  "South Alabama","South Carolina","South Carolina State","South Dakota State","South Florida","Southern Illinois","Southern Miss","Southern University",
  "Stanford","Stephen F. Austin","Syracuse","TCU","Temple","Tennessee","Tennessee State","Texas",
  "Texas A&M","Texas A&M-Kingsville","Texas State","Texas Tech","Toledo","Troy","Tulane","Tulsa",
  "UAB","UCF","UCLA","UConn","UMass","UNLV","USC","UTEP",
  "UTSA","Utah","Utah State","Vanderbilt","Virginia","Virginia Tech","Wake Forest","Washington",
  "Washington State","West Virginia","Western Illinois","Western Kentucky","Western Michigan","William & Mary","Wisconsin","Wyoming"
];

function hashColor(name){
  let h = 0;
  for(let i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) | 0; }
  const hue1 = Math.abs(h) % 360;
  const hue2 = (hue1 + 40) % 360;
  return `linear-gradient(135deg, hsl(${hue1},55%,32%), hsl(${hue2},45%,18%))`;
}

// Stylized badge styling (original color pairings + abbreviations for this game — not
// official team/league marks). NFL teams are all hand-curated; colleges are curated for
// widely recognized programs, with a deterministic color fallback for the rest so every
// school still gets a distinct-looking badge without hand-authoring 130+ palettes.
const TEAM_STYLE = {
  "Bills":{abbr:"BUF", bg:"linear-gradient(135deg,#00338d,#c60c30)"},
  "Dolphins":{abbr:"MIA", bg:"linear-gradient(135deg,#008e97,#fc4c02)"},
  "Patriots":{abbr:"NE", bg:"linear-gradient(135deg,#0a2342,#b0313f)"},
  "Jets":{abbr:"NYJ", bg:"linear-gradient(135deg,#125740,#0c371f)"},
  "Ravens":{abbr:"BAL", bg:"linear-gradient(135deg,#241773,#9e7c0c)"},
  "Bengals":{abbr:"CIN", bg:"linear-gradient(135deg,#fb4f14,#1a1a1a)"},
  "Browns":{abbr:"CLE", bg:"linear-gradient(135deg,#311d00,#ff3c00)"},
  "Steelers":{abbr:"PIT", bg:"linear-gradient(135deg,#1a1a1a,#ffb612)"},
  "Texans":{abbr:"HOU", bg:"linear-gradient(135deg,#03202f,#a71930)"},
  "Colts":{abbr:"IND", bg:"linear-gradient(135deg,#002c5f,#a2aaad)"},
  "Jaguars":{abbr:"JAX", bg:"linear-gradient(135deg,#006778,#9f792c)"},
  "Titans":{abbr:"TEN", bg:"linear-gradient(135deg,#0c2340,#4b92db)"},
  "Broncos":{abbr:"DEN", bg:"linear-gradient(135deg,#fb4f14,#002244)"},
  "Chiefs":{abbr:"KC", bg:"linear-gradient(135deg,#e31837,#ffb612)"},
  "Raiders":{abbr:"LV", bg:"linear-gradient(135deg,#1a1a1a,#a5acaf)"},
  "Chargers":{abbr:"LAC", bg:"linear-gradient(135deg,#0080c6,#ffc20e)"},
  "Cowboys":{abbr:"DAL", bg:"linear-gradient(135deg,#041e42,#7a828f)"},
  "Giants":{abbr:"NYG", bg:"linear-gradient(135deg,#0b2265,#a71930)"},
  "Eagles":{abbr:"PHI", bg:"linear-gradient(135deg,#004c54,#a5acaf)"},

/* ---------------- HELPERS ---------------- */
function normalize(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\b(jr|sr|ii|iii|iv)\b\.?/g,"")
    .replace(/[^a-z0-9 ]/g,"")
    .replace(/\s+/g," ").trim();
}
function playersFor(team, college){
  return POOL_DATA.filter(p => p.c===college && p.t.includes(team));
}
// Per-mode floor on how many real answers a cell must have to be usable at all — the
// floor itself is one lever of difficulty (fewer possible answers = harder), separate
// from the notability-based ranking below.
const MODE_RULES = {
  rookie: { minPlayers: 14 },
  pro:    { minPlayers: 10 },
  hof:    { minPlayers: 6  }
};
function pairValid(team, college, minPlayers){ return playersFor(team,college).length >= minPlayers; }

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed>>>15), 1 | seed);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  }
}
function seedFromDate(dateStr){
  let h = 0;
  for(let i=0;i<dateStr.length;i++){ h = (h*31 + dateStr.charCodeAt(i)) | 0; }
  return h;
}
function combos(arr, k){
  const res = [];
  function rec(start, chosen){
    if(chosen.length===k){ res.push(chosen.slice()); return; }
    for(let i=start;i<arr.length;i++){
      chosen.push(arr[i]);
      rec(i+1, chosen);
      chosen.pop();
    }
  }
  rec(0, []);
  return res;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* ---------------- CELL DIFFICULTY ----------------
   A cell's difficulty (1=easiest, 10=hardest) blends two real, data-backed signals the
   player actually experiences: how many valid answers exist (a shallow pool means fewer
   ways in), and how recognizable those answers tend to be (a pool of long-career/famous
   names is easier to draw a correct guess from than one full of one-year names). Notability
   per player reuses hand-curated fame where we have it, and career length everywhere else —
   see longevityScoreFor below, same proxy Autocomplete Grid uses.
*/
const _cellDifficultyCache = {};
function cellDifficultyScore(team, college){
  const key = team+'|'+college;
  if(key in _cellDifficultyCache) return _cellDifficultyCache[key];
  const pool = playersFor(team, college);
  const poolSize = pool.length;
  let totalNotability = 0;
  for(const p of pool){
    totalNotability += (typeof p.f === 'number') ? p.f : longevityScoreFor(p.n);
  }
  const avgNotability = poolSize ? totalNotability/poolSize : 10;
  const poolDifficulty = Math.max(1, Math.min(10, Math.round(10 - (Math.min(poolSize,50)/50)*9)));
  const difficulty = Math.round(poolDifficulty*0.5 + avgNotability*0.5);
  const result = { poolSize, avgNotability, difficulty };
  _cellDifficultyCache[key] = result;
  return result;
}

/* ---------------- PUZZLE GENERATION ----------------
   With 32 teams and 133 colleges, exhaustively checking every 3-team x 3-college
   combination (millions of pairs) isn't practical in a browser. Instead:
   1. Only consider teams/colleges that already have enough verified players in
      POOL_DATA (per-mode floor from MODE_RULES) to plausibly form a solvable grid.
   2. Every 3-team combo whose eligible colleges intersect in 3+ is checked exhaustively
      (32-choose-3 is only 4,960 combos — trivial).
   3. Within a chosen team-triple, colleges are ranked by cellDifficultyScore and each
      mode draws from its own third of that ranking (Rookie = easiest third, Pro =
      middle, Hall of Fame = hardest third) — relative to what's actually available for
      that specific triple, rather than a fixed absolute cutoff that might not exist.
*/
function sampleThree(arr, rng){
  const copy = arr.slice();
  const picked = [];
  for(let i=0;i<3 && copy.length>0;i++){
    const idx = Math.floor(rng()*copy.length);
    picked.push(copy[idx]);
    copy.splice(idx,1);
  }
  return picked;
}
function sampleThreeByDifficulty(teams, collegePool, mode, rng){
  const scored = collegePool.map(c=>{
    let sum=0;
    for(const t of teams) sum += cellDifficultyScore(t,c).difficulty;
    return { c, avg: sum/teams.length };
  });
  scored.sort((a,b)=>a.avg-b.avg); // ascending: easiest first
  const n = scored.length;
  const thirdSize = Math.max(3, Math.ceil(n/3));
  let bucket;
  if(mode==='rookie'){
    bucket = scored.slice(0, thirdSize);
  } else if(mode==='hof'){
    bucket = scored.slice(Math.max(0, n-thirdSize));
  } else {
    const start = Math.max(0, Math.floor((n-thirdSize)/2));
    bucket = scored.slice(start, start+thirdSize);
  }
  const pool = bucket.length>=3 ? bucket.map(x=>x.c) : scored.map(x=>x.c);
  return sampleThree(pool, rng);
}
let _viableComboCache = {};
function getViableCombos(mode){
  if(_viableComboCache[mode]) return _viableComboCache[mode];
  const minPlayers = MODE_RULES[mode].minPlayers;
  // For each team, the set of colleges that give it a well-populated (>=minPlayers) cell.
  const goodCollegesForTeam = {};
  NFL_TEAMS.forEach(t=>{
    goodCollegesForTeam[t] = COLLEGES.filter(c => pairValid(t,c,minPlayers));
  });
  const viableTeams = NFL_TEAMS.filter(t => goodCollegesForTeam[t].length >= 3);
  const viableCombos = [];
  const teamTriples = combos(viableTeams, 3);
  for(const teams of teamTriples){
    let intersection = goodCollegesForTeam[teams[0]];
    for(let i=1;i<teams.length && intersection.length>=3;i++){
      const set = new Set(goodCollegesForTeam[teams[i]]);
      intersection = intersection.filter(c => set.has(c));
    }
    if(intersection.length >= 3){
      viableCombos.push({ teams, colleges: intersection });
    }
  }
  _viableComboCache[mode] = viableCombos;
  return viableCombos;
}
function buildTodaysPuzzle(dateOverride, mode){
  mode = MODE_RULES[mode] ? mode : 'pro';
  const date = dateOverride || todayStr();
  // Seed includes the mode so each mode gets its own stable-per-day grid, not the same
  // grid with different colleges swapped in.
  const rng = mulberry32(seedFromDate(date + '|' + mode));

  const viableCombos = getViableCombos(mode);
  if(!viableCombos.length){
    // Should never happen at these thresholds against the current dataset, but rather
    // than silently building a broken grid, surface it clearly.
    throw new Error(`No valid ${mode} puzzle combos found — check MODE_RULES / data pool.`);
  }

  const pick = viableCombos[Math.floor(rng() * viableCombos.length)];
  const teams = pick.teams.slice();
  const cols = sampleThreeByDifficulty(teams, pick.colleges, mode, rng);
  // Hard guarantee, checked every time, independent of the selection logic above:
  // refuse to hand back a puzzle unless all 9 cells actually clear the minimum.
  const minPlayers = MODE_RULES[mode].minPlayers;
  for(const t of teams){
    for(const c of cols){
      const n = playersFor(t, c).length;
      if(n < minPlayers){
        throw new Error(`Puzzle generation produced an invalid cell: ${t} x ${c} has only ${n} players (minimum ${minPlayers}) for ${mode}. This should be impossible — data or logic bug.`);
      }
    }
  }
  return { date, mode, teams, cols };
}

function defaultUnlocks(){ return { pro:false, hof:false }; }

function enforceDifficultyUnlocked(){
  const unlocked = stats.unlocked || defaultUnlocks();
  if(difficulty==='hof' && !unlocked.hof) difficulty = unlocked.pro ? 'pro' : 'rookie';
  else if(difficulty==='pro' && !unlocked.pro) difficulty = 'rookie';
  lsSet('difficulty', difficulty);

function applyDifficultyUI(){
  const unlocked = stats.unlocked || defaultUnlocks();
  const progress = stats.modeProgress || defaultModeProgress();
  document.querySelectorAll('.diff-btn').forEach(b=>{
    const d = b.dataset.diff;
    const isLocked = (d==='pro' && !unlocked.pro) || (d==='hof' && !unlocked.hof);
    b.classList.toggle('active', d===difficulty);
    b.classList.toggle('locked', isLocked);
    b.innerHTML = isLocked ? `🔒 ${DIFFICULTY_INFO[d].label}` : DIFFICULTY_INFO[d].label;
  });
  const info = DIFFICULTY_INFO[difficulty];
  const descEl = document.getElementById('difficultyDesc');
  if(descEl){
    let extra = '';
    if(difficulty==='rookie' && !unlocked.pro){
      const c = Math.min(progress.rookie.count, REQUIRE_STREAK_DAYS);
      extra = ` · Pro unlocks at a ${REQUIRE_STREAK_DAYS}-day streak of ${QUALIFY_SCORE.rookie}+/9 (${c}/${REQUIRE_STREAK_DAYS})`;
    } else if(difficulty==='pro' && !unlocked.hof){
      const c = Math.min(progress.pro.count, REQUIRE_STREAK_DAYS);
      extra = ` · Hall of Fame unlocks at a ${REQUIRE_STREAK_DAYS}-day streak of ${QUALIFY_SCORE.pro}+/9 (${c}/${REQUIRE_STREAK_DAYS})`;
    }
    descEl.textContent = info.desc + extra;
  }
}
async function setDifficulty(d){
  if(!DIFFICULTY_INFO[d]) return;
  const unlocked = stats.unlocked || defaultUnlocks();
  if(d==='pro' && !unlocked.pro){ showToast('Pro is locked — build a streak in Rookie first', 'wrong'); return; }
  if(d==='hof' && !unlocked.hof){ showToast('Hall of Fame is locked — build a streak in Pro first', 'wrong'); return; }
  if(d === difficulty){ applyDifficultyUI(); return; }
  difficulty = d;
  lsSet('difficulty', d);
  closeModal(); // an open guess modal would reference a cell from the old grid
  applyDifficultyUI();
  // Each mode has its own grid, so switching modes has to rebuild the puzzle, not just
  // change UI chrome around the same one.
  if(currentDateStr) await loadPuzzleForDate(currentDateStr);
}
function isConsecutiveDay(prevDateStr, dateStr){
  if(!prevDateStr) return false;
  const prev = new Date(prevDateStr+'T00:00:00');
  const cur = new Date(dateStr+'T00:00:00');
  const diffDays = Math.round((cur-prev)/86400000);
  return diffDays === 1;
}
function updateModeUnlocks(correct){
  if(!TODAY_STR || puzzle.date !== TODAY_STR) return; // only the live daily puzzle counts
  stats.unlocked = stats.unlocked || defaultUnlocks();
  stats.modeProgress = stats.modeProgress || defaultModeProgress();

  if(difficulty === 'rookie' && !stats.unlocked.pro){
    const mp = stats.modeProgress.rookie;
    if(mp.lastDate === puzzle.date) return; // already counted today's Rookie result
    mp.count = (correct >= QUALIFY_SCORE.rookie) ? (isConsecutiveDay(mp.lastDate, puzzle.date) ? mp.count+1 : 1) : 0;
    mp.lastDate = puzzle.date;
    if(mp.count >= REQUIRE_STREAK_DAYS){
      stats.unlocked.pro = true;
      showToast('🔓 Pro mode unlocked!', 'correct');
    }
  } else if(difficulty === 'pro' && !stats.unlocked.hof){
    const mp = stats.modeProgress.pro;
    if(mp.lastDate === puzzle.date) return; // already counted today's Pro result
    mp.count = (correct >= QUALIFY_SCORE.pro) ? (isConsecutiveDay(mp.lastDate, puzzle.date) ? mp.count+1 : 1) : 0;
    mp.lastDate = puzzle.date;
    if(mp.count >= REQUIRE_STREAK_DAYS){
      stats.unlocked.hof = true;
      showToast('🔓 Hall of Fame mode unlocked!', 'correct');
    }
  }
}

// Personal progress/stats use localStorage directly -- this works standalone with no
// backend. The "picks" data below (used for rarity) is written to localStorage too,
// which means it's only shared across sessions on THIS browser, not across real users.
// To get true cross-user rarity once this is live on your domain, swap the localStorage
// calls in recordPick/getRarity for calls to a small backend (a Cloudflare Worker + KV,
// or Firebase, are both simple options) that stores counts centrally.
function lsGet(key){
  try{
    const raw = localStorage.getItem(key);
    return raw === null ? null : raw;
  }catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){}
}

  let cur = {};
  const raw = lsGet(key);
  if(raw){
    try{ cur = JSON.parse(raw); }catch(e){ cur = {}; }
  }
  cur.total = (cur.total||0) + 1;
  cur.counts = cur.counts || {};
  cur.counts[name] = (cur.counts[name]||0) + 1;
  lsSet(key, JSON.stringify(cur));
  return cur;
}
// Converts a pick-count record into a 1-10 rarity score. 10 = extremely rare (almost no one else picked it),
// 1 = very common (most people picked it).
// Since crowd data is thin early on, we blend it with each player's built-in "fame" rating (1=icon, 10=obscure)
// and let real crowd data take over as more people play that cell.
const COLD_START_THRESHOLD = 8;
function rarityFromCounts(cur, name){
  const player = POOL_DATA.find(p => p.n === name);
  const fame = (player && typeof player.f === 'number') ? player.f : 6;
  if(!cur) return fame;
  const total = cur.total || 0;
  const count = (cur.counts && cur.counts[name]) || 0;
  const pct = total>0 ? (count/total)*100 : 0;
  const crowdScore = Math.max(1, Math.min(10, Math.round(10 - (pct/100)*9)));
  const weight = Math.min(total, COLD_START_THRESHOLD) / COLD_START_THRESHOLD;
  const blended = Math.round(fame*(1-weight) + crowdScore*weight);
  return Math.max(1, Math.min(10, blended));
}
async function getRarity(college, team, name){
  const key = `picks:${puzzle.date}:${college}|${team}`;
  const raw = lsGet(key);
  if(raw){
    try{ return rarityFromCounts(JSON.parse(raw), name); }catch(e){}
  }
  return null;
}

// Ranks a cell's candidates by "how recognizable is this pick," combined with recency
// so a still-active or recently-retired name outranks an equally-notable player from
// decades ago. Deterministic (no randomness) so the same puzzle always reveals the same
// answers.
function recencyScoreFor(player, team){
  const raw = player.y && player.y[team];
  if(!raw) return 10; // no year on file — treat as least-recent/unknown
  const parts = String(raw).split('-').map(s=>parseInt(s,10)).filter(n=>!isNaN(n));
  if(!parts.length) return 10;
  const mostRecent = Math.max(...parts);
  const puzzleYear = parseInt((puzzle && puzzle.date ? puzzle.date : todayStr()).slice(0,4), 10);
  const yearsAgo = puzzleYear - mostRecent;
  if(yearsAgo <= 1) return 1;
  if(yearsAgo <= 3) return 2;
  if(yearsAgo <= 5) return 3;
  if(yearsAgo <= 8) return 4;
  if(yearsAgo <= 12) return 5;
  if(yearsAgo <= 16) return 6;
  if(yearsAgo <= 20) return 7;
  if(yearsAgo <= 25) return 8;
  if(yearsAgo <= 30) return 9;
  return 10;
}
// Only ~1.4% of POOL_DATA carries a hand-curated fame rating — everyone else would
// otherwise fall back to a meaningless flat default and get ranked essentially at random.
// For the un-curated majority, career length (years active in the NFL, merged across every
// team they played for) is a real, data-backed stand-in for "well known": a player who
// stuck in the league for a decade is a safer bet to be recognizable than a one-year name.
const _careerRangeCache = {};
function careerRangeForName(name){
  if(name in _careerRangeCache) return _careerRangeCache[name];
  let min=null, max=null;
  for(const p of POOL_DATA){
    if(p.n!==name || !p.y) continue;
    for(const t in p.y){
      const parts = String(p.y[t]).split('-').map(s=>parseInt(s,10)).filter(n=>!isNaN(n));
      for(const y of parts){
        if(min===null||y<min) min=y;
        if(max===null||y>max) max=y;
      }
    }
  }
  const range = { min, max, length: (min===null) ? 0 : (max-min+1) };
  _careerRangeCache[name] = range;
  return range;
}
function careerLengthForName(name){
  return careerRangeForName(name).length;
}
// Display text for the autocomplete dropdown: the years they were active, e.g. "2001–2013".
function careerSpanTextForName(name){
  const r = careerRangeForName(name);
  if(r.min===null) return null;
  return r.min===r.max ? `${r.min}` : `${r.min}–${r.max}`;
}
function longevityScoreFor(name){
  const len = careerLengthForName(name);
  if(len>=12) return 1;
  if(len>=9) return 2;
  if(len>=7) return 3;
  if(len>=5) return 4;
  if(len>=4) return 5;
  if(len>=3) return 6;
  if(len>=2) return 7;
  if(len>=1) return 8;
  return 10; // no year data at all — can't judge longevity
}
// Most accomplished + most recently active pick for a cell, used by Autocomplete Grid.
// Prefers hand-curated fame when any candidate in the pool has it; otherwise falls back
// to the career-longevity proxy above, rather than let an uninformative default decide.
function bestKnownPlayerFor(team, college){
  const pool = playersFor(team, college);
  if(!pool.length) return null;
  const curated = pool.filter(p => typeof p.f === 'number');
  const usingCurated = curated.length > 0;
  const source = usingCurated ? curated : pool;
  const scored = source.map(p=>{
    const recency = recencyScoreFor(p, team);
    const successScore = usingCurated ? p.f : longevityScoreFor(p.n);
    return { p, successScore, score: successScore*0.65 + recency*0.35 };
  });
  scored.sort((a,b)=> a.score - b.score || a.successScore - b.successScore || a.p.n.localeCompare(b.p.n));
  return scored[0].p;
}

function renderGrid(){

  }

    html += `<tr><td class="rowhead">${teamBadge(puzzle.teams[r])}</td>`;
    for(let c=0;c<3;c++){
      const cs = cellState[r][c];
      let inner = '<span class="cell-plus">+</span>';
      let cls = 'cell';
      if(cs.status==='correct'){
        cls += ' correct';
        const rarityHtml = (cs.rarity!=null)
          ? `<div class="cell-rarity-badge" id="rarity-${r}-${c}">Rarity ${cs.rarity}/10</div>`
          : `<div class="cell-rarity-badge" id="rarity-${r}-${c}">Rarity …</div>`;
        const yearsHtml = `<div class="cell-years" id="years-${r}-${c}">${cs.years || ''}</div>`;
        const dupeCount = cellState.flat().filter(x=>x.status==='correct' && normalize(x.guess)===normalize(cs.guess)).length;
        const dupeHtml = dupeCount>1 ? `<div class="cell-dupe">Used ${dupeCount}x in grid</div>` : '';
        inner = `<div class="cell-inner"><div class="cell-name">✓ ${cs.guess}</div>${yearsHtml}${rarityHtml}${dupeHtml}</div>`;
      } else if(cs.status==='wrong'){

        inner = `<div class="cell-inner"><div class="cell-miss">X</div><div class="cell-name" style="opacity:0.6;font-size:11px;">${cs.guess}</div></div>`;
      }
      html += `<td class="${cls}" data-r="${r}" data-c="${c}" onclick="onCellClick(${r},${c})">${inner}</td>`;
    }
    html += '</tr>';
  }

  updateAutocompleteVisibility();
}

function renderScoreboard(){
  const correct = cellState.flat().filter(c=>c.status==='correct').length;
  const answered = cellState.flat().filter(c=>c.status==='correct' || c.status==='wrong').length;
  document.getElementById('scoreNum').textContent = correct+"/9";
  document.getElementById('guessesNum').textContent = Math.max(0, 9 - answered);
  document.getElementById('streakNum').textContent = stats.streak||0;
  document.getElementById('playedNum').textContent = stats.played||0;
  document.getElementById('dateLabel').textContent = puzzle.date + " · college × NFL crossover";
}

function allFilled(){
  return cellState.flat().every(c=>c.status==='correct' || c.status==='wrong');
}

function getYearsLocal(name, college, team){
  // A player can appear in more than one of our merged sources (hand-curated, draft-only,
  // full roster history) for the same college+team — only the roster-history entries carry
  // real year data, so check every match rather than stopping at the first one found.
  const candidates = POOL_DATA.filter(p => p.n === name && p.c === college && p.t.includes(team));
  for(const p of candidates){
    if(p.y && p.y[team]) return p.y[team];
  }
  return null;
}

async function renderRaritiesIfDone(){
  // Backfills rarity scores and years-played for correct cells that don't have them yet
  // (e.g. restored from a previous session before those were computed).
  for(let r=0;r<3;r++){
    for(let c=0;c<3;c++){
      const cs = cellState[r][c];
      if(cs.status==='correct' && cs.rarity==null){
        const rar = await getRarity(puzzle.cols[c], puzzle.teams[r], cs.guess);
        cs.rarity = rar ?? 5;
        const el = document.getElementById(`rarity-${r}-${c}`);
        if(el) el.textContent = `Rarity ${cs.rarity}/10`;
      }
      if(cs.status==='correct' && !cs.years){
        const years = getYearsLocal(cs.guess, puzzle.cols[c], puzzle.teams[r]);
        if(years){
          cs.years = years;
          const el = document.getElementById(`years-${r}-${c}`);
          if(el) el.textContent = years;
        }
      }
    }
  }
  await saveProgress();
  if(allFilled()) renderSummary();
}

function usedNamesInGrid(){
  const names = new Set();
  cellState.flat().forEach(cs=>{ if(cs.status==='correct') names.add(normalize(cs.guess)); });
  return names;
}
function onCellClick(r,c){
  if(cellState[r][c].status!=='empty') return;
  const team = puzzle.teams[r];
  const college = puzzle.cols[c];
  const info = DIFFICULTY_INFO[difficulty];
  const zone = document.getElementById('modalZone');
  const canHint = info.hint && !hintUsedThisPuzzle;
  zone.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal">
        <h3>${college} → ${team}</h3>
        <div class="req">Name a player who played college ball at ${college} and later played for the ${team}.</div>
        <input type="text" id="guessInput" placeholder="Start typing a name…" autocomplete="off">
        ${info.autocomplete ? '<div class="suggest" id="suggestList"></div>' : ''}
        <div class="hint" id="noMatchHint"></div>
        ${info.noRepeat ? '<div class="hint">Hall of Fame mode: no player can be reused elsewhere in this grid.</div>' : ''}
        ${info.autocomplete ? '<div class="hint">Stuck on the whole grid instead? Use the Autocomplete Grid button below the board — it surrenders your streak.</div>' : ''}
        ${info.hint ? `<button class="hint-btn" id="hintBtn" ${canHint?'':'disabled'} onclick="useHint('${team.replace(/'/g,"\\'")}','${college.replace(/'/g,"\\'")}')">${canHint ? '💡 Use hint (reveals initials)' : '💡 Hint already used this puzzle'}</button><div class="hint-reveal" id="hintReveal"></div>` : ''}
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" id="submitGuess">Submit</button>
        </div>
      </div>
    </div>
  `;
  const input = document.getElementById('guessInput');
  input.focus();
  if(info.autocomplete){
    input.addEventListener('input', ()=>{
      const val = normalize(input.value);
      const list = document.getElementById('suggestList');
      const hint = document.getElementById('noMatchHint');
      if(val.length<2){ list.innerHTML=''; hint.innerHTML=''; return; }
      const matches = ALL_NAMES.filter(n => normalize(n).includes(val)).slice(0,8);
      list.innerHTML = matches.map(n=>{
        const span = careerSpanTextForName(n);
        const spanHtml = span ? `<span class="suggest-years">${span}</span>` : '';
        return `<div onclick="selectSuggestion('${n.replace(/'/g,"\\'")}')"><span class="suggest-name">${n}</span>${spanHtml}</div>`;
      }).join('');
      // No suggestions usually means this exact spelling isn't in the database —
      // double-check the spelling, but you can still submit if you're confident.
      hint.innerHTML = matches.length ? '' : `No matching name found yet — double-check the spelling and submit when ready.`;
    });
  } else {
    input.addEventListener('input', ()=>{
      const val = normalize(input.value);
      const hint = document.getElementById('noMatchHint');
      if(val.length<2){ hint.innerHTML=''; return; }
      const hasMatch = ALL_NAMES.some(n => normalize(n).includes(val));
      hint.innerHTML = hasMatch ? '' : `No matching name found yet — double-check the spelling and submit when ready.`;
    });
  }
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitGuess(r,c,input.value); });
  document.getElementById('submitGuess').onclick = ()=>submitGuess(r,c,input.value);
  document.getElementById('backdrop').addEventListener('click',(e)=>{ if(e.target.id==='backdrop') closeModal(); });
}
function selectSuggestion(name){
  document.getElementById('guessInput').value = name;
  const list = document.getElementById('suggestList');
  if(list) list.innerHTML = '';
}
function playerInitials(name){
  return name.split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()).join('.') + '.';
}
function useHint(team, college){
  if(hintUsedThisPuzzle) return;
  const pool = playersFor(team, college);
  if(!pool.length) return;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  hintUsedThisPuzzle = true;
  lsSet('hint:'+puzzle.date+':'+puzzle.mode, '1');
  const reveal = document.getElementById('hintReveal');
  if(reveal) reveal.textContent = `Initials: ${playerInitials(pick.n)} · ${pick.n.length} characters`;
  const btn = document.getElementById('hintBtn');
  if(btn){ btn.disabled = true; btn.textContent = '💡 Hint already used this puzzle'; }
}

async function submitGuess(r,c,rawVal){
  const val = rawVal.trim();
  if(!val) return;
  const team = puzzle.teams[r];
  const college = puzzle.cols[c];
  const norm = normalize(val);
  closeModal();

  // Check the curated + real nflverse database (~18,500 entries). Instant, no network
  // call, so there's no "couldn't verify" state — every guess resolves immediately.
  const localMatch = playersFor(team, college).find(p => normalize(p.n)===norm);
  const info = DIFFICULTY_INFO[difficulty];

  if(localMatch && info.noRepeat && usedNamesInGrid().has(normalize(localMatch.n))){
    cellState[r][c] = {status:'wrong', guess: val + ' (already used)'};
    renderGrid();
    renderScoreboard();
    showToast('Already used elsewhere in this grid', 'wrong');
    await saveProgress();
    if(allFilled()) await finalizeIfNeeded();
    return;
  }

  if(localMatch){
    cellState[r][c] = {status:'correct', guess:localMatch.n, rarity:null, years:null};
    renderGrid();
    renderScoreboard();
    showToast('Correct!', 'correct');
    const cur = await recordPick(college, team, localMatch.n);
    const rarity = rarityFromCounts(cur, localMatch.n) ?? 5;
    cellState[r][c].rarity = rarity;
    const badge = document.getElementById(`rarity-${r}-${c}`);
    if(badge) badge.textContent = `Rarity ${rarity}/10`;
    const years = getYearsLocal(localMatch.n, college, team);
    cellState[r][c].years = years;
    const yearsEl = document.getElementById(`years-${r}-${c}`);
    if(yearsEl) yearsEl.textContent = years || '';
  } else {
    cellState[r][c] = {status:'wrong', guess: val};
    renderGrid();
    renderScoreboard();
    showToast('Incorrect', 'wrong');
  }

  await saveProgress();
  if(allFilled()){
    await finalizeIfNeeded();
  }
}

async function finalizeIfNeeded(){
  const correct = cellState.flat().filter(c=>c.status==='correct').length;
  if(stats.lastDate !== puzzle.date){
    stats.played = (stats.played||0) + 1;
    if(correct>0){
      stats.streak = (stats.streak||0) + 1;
    } else {
      stats.streak = 0;
    }
    stats.lastDate = puzzle.date;
  }
  updateModeUnlocks(correct);
  await saveStats();
  applyDifficultyUI();
  renderScoreboard();
  await renderRaritiesIfDone();
}

/* ---------------- AUTOCOMPLETE GRID (surrender) ---------------- */
function updateAutocompleteVisibility(){
  const row = document.getElementById('autocompleteRow');
  if(!row || !puzzle) return;
  const info = DIFFICULTY_INFO[difficulty];
  const remaining = cellState.flat().filter(c=>c.status!=='correct').length;
  row.style.display = (info.autocomplete && remaining>0) ? 'flex' : 'none';
}
// Surrendering doesn't earn the streak/unlock progress a real finish would — it forces
// the streak to 0 and wipes any in-progress unlock streak for whichever tier was being
// played, since the grid wasn't actually solved.
async function surrenderFinalize(){
  if(stats.lastDate !== puzzle.date){
    stats.played = (stats.played||0) + 1;
    stats.lastDate = puzzle.date;
  }
  stats.streak = 0;
  stats.unlocked = stats.unlocked || defaultUnlocks();
  stats.modeProgress = stats.modeProgress || defaultModeProgress();
  if(difficulty==='rookie') stats.modeProgress.rookie = {count:0,lastDate:null};
  if(difficulty==='pro') stats.modeProgress.pro = {count:0,lastDate:null};
  await saveStats();
  applyDifficultyUI();
  renderScoreboard();
  await renderRaritiesIfDone();
}
async function confirmAutocomplete(){
  const remaining = cellState.flat().filter(c=>c.status!=='correct').length;
  if(remaining===0) return;
  const ok = window.confirm('Autocomplete reveals the rest of the grid with the most accomplished, most recently active player for each cell — and resets your streak to 0. This can\'t be undone. Continue?');
  if(!ok) return;
  for(let r=0;r<3;r++){
    for(let c=0;c<3;c++){
      if(cellState[r][c].status==='correct') continue;
      const team = puzzle.teams[r];
      const college = puzzle.cols[c];
      const best = bestKnownPlayerFor(team, college);
      if(best){
        cellState[r][c] = {status:'correct', guess:best.n, rarity:null, years:null};
      }
    }
  }
  renderGrid();
  renderScoreboard();
  await saveProgress();
  await surrenderFinalize();
  renderSummary();
  showToast('Grid revealed — streak reset to 0', 'wrong');
}

const TODAY_STR = todayStr();

function freshCellState(){
  const cs = [];
  for(let r=0;r<3;r++){
    cs.push([{status:'empty',guess:''},{status:'empty',guess:''},{status:'empty',guess:''}]);
  }
  return cs;

let currentDateStr = null;
async function loadPuzzleForDate(dateStr){
  currentDateStr = dateStr;
  // Load stats first so we know the CONFIRMED unlocked difficulty before building the
  // puzzle — each mode now generates its own distinct grid, so we can't build until we
  // know which mode we're actually allowed to be in.
  await loadStats();
  enforceDifficultyUnlocked();

  // Build the new puzzle and immediately wipe + render an empty board BEFORE any
  // async storage lookups run. This guarantees the old puzzle's picks can never
  // stay on screen, even for an instant, while we go check for saved progress.
  puzzle = buildTodaysPuzzle(dateStr, difficulty);
  cellState = freshCellState();
  hintUsedThisPuzzle = lsGet('hint:'+puzzle.date+':'+puzzle.mode) === '1';
  applyDifficultyUI();
  renderGrid();
  renderScoreboard();
  document.getElementById('summaryZone').innerHTML = '';

  await loadCellState();
  renderGrid();
  renderScoreboard();
  await renderRaritiesIfDone();
  const backBtn = document.getElementById('backToTodayBtn');
  const dateInput = document.getElementById('archiveDate');
  if(backBtn) backBtn.style.display = (dateStr === TODAY_STR) ? 'none' : 'inline-block';
  if(dateInput) dateInput.value = dateStr;
}
async function switchToDate(dateStr){
  if(!dateStr) return;
  if(dateStr > TODAY_STR) dateStr = TODAY_STR; // no peeking at future puzzles
  await loadPuzzleForDate(dateStr);
}
async function switchToToday(){
  await loadPuzzleForDate(TODAY_STR);
}

/* ---------------- INIT ---------------- */
async function loadData(){
  const res = await fetch('./data.json');
  const merged = await res.json();
  POOL_DATA = merged;
  ALL_NAMES = [...new Set(POOL_DATA.map(p=>p.n))].sort();
}
async function init(){
  await loadData();
  applyDifficultyUI();
  const dateInput = document.getElementById('archiveDate');
  if(dateInput){
    dateInput.max = TODAY_STR;
    dateInput.min = '2020-01-01';
    dateInput.value = TODAY_STR;
  }
  await loadPuzzleForDate(TODAY_STR);
  if(!lsGet('seenHowTo')) openHowTo();
}
init();
</script>
</body>
